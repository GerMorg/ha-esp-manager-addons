<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ESP Manager</title><style>body{font-family:system-ui;background:#111827;color:#e5e7eb;margin:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px}.card{background:#1f2937;padding:14px;border-radius:12px}.item{padding:7px;border-bottom:1px solid #374151;cursor:pointer}button,input,select,textarea{margin:3px;padding:7px}textarea,pre{width:100%;box-sizing:border-box;background:#030712;color:#eee}textarea{height:250px}.row{display:flex;flex-wrap:wrap;gap:4px}.ok{color:#22c55e}.bad{color:#ef4444}</style></head><body><h1>ESP Manager Dev 0.10.0.1</h1><div class="grid"><section class="card"><h2>Neues Projekt</h2><input id="newName"><select id="newBoard"><option>esp32dev</option><option>nodemcuv2</option><option>esp12e</option><option>esp32-s2-saola-1</option><option>esp32-s3-devkitc-1</option><option>esp32-c3-devkitm-1</option><option>esp32-c6-devkitc-1</option></select><button id="create">Anlegen</button><h3>Projekt-ZIP importieren</h3><input id="importName" placeholder="Neuer Name"><input id="importZip" type="file"><button id="importBtn">Importieren</button><div id="projects"></div></section><section class="card"><h2>Geräte</h2><div id="devices"></div><pre id="deviceDetail"></pre><pre id="deviceHistory"></pre></section></div><section class="card"><h2 id="projectTitle">Projekt öffnen</h2><div class="row"><input id="displayName" placeholder="Anzeigename"><select id="board"></select><input id="version" placeholder="Version"><input id="baud" type="number"><button id="saveSettings">Einstellungen speichern</button></div><details><summary>Expertenbereich</summary><label>Bibliotheken</label><textarea id="libraries"></textarea><label>Build-Flags</label><textarea id="flags"></textarea><input id="pioFile" type="file"><button id="pioImport">platformio.ini übernehmen</button></details><div class="row"><button id="duplicate">Duplizieren</button><button id="backup">Backup</button><button id="export">Exportieren</button><button id="deleteProject">Projekt löschen</button><input id="arduinoZip" type="file"><button id="arduinoImport">Arduino-ZIP migrieren</button><a id="hardwareLink">USB, OTA & Status</a></div><h3>Programmdateien</h3><div class="row"><input id="newFile" placeholder="src/datei.cpp"><button id="createFile">Neu</button><button id="renameFile">Umbenennen</button><button id="deleteFile">Datei löschen</button><input id="uploadFiles" type="file" multiple><select id="uploadPath"><option>src</option><option>include</option><option>lib</option></select><button id="uploadBtn">Hochladen</button></div><div id="files"></div><textarea id="editor"></textarea><button id="saveFile">Speichern</button><h3>Build</h3><button id="build">Kompilieren</button><button id="cancel">Abbrechen</button><pre id="buildLog"></pre><h3>Buildhistorie</h3><button id="prune">Alte Builds bereinigen</button><div id="builds"></div></section><div id="toast"></div><script src="static/app.js"></script></body></html>
