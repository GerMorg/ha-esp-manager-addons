name: ESP Manager Dev
description: Arduino and PlatformIO ESP device manager development branch
version: 0.8.0-dev
slug: esp_manager_dev
init: false
arch: [amd64, aarch64, armv7]
startup: services
boot: auto
ingress: true
ingress_port: 8100
panel_icon: mdi:chip
panel_title: ESP Manager Dev
host_network: true
map:
  - config:rw
options:
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  device_mqtt_host: homeassistant.local
  device_mqtt_port: 1883
  device_mqtt_username: ""
  device_mqtt_password: ""
  public_base_url: http://homeassistant.local:8100
  build_retention: 5
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  device_mqtt_host: str
  device_mqtt_port: port
  device_mqtt_username: str?
  device_mqtt_password: password?
  public_base_url: str
  build_retention: int(1,50)
ports:
  8100/tcp: 8100
