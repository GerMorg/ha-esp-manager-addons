name: ESP Manager
description: Arduino/PlatformIO ESP device manager
version: 0.4.0
slug: esp_manager
init: false
arch: [amd64, aarch64, armv7]
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:chip
panel_title: ESP Manager
host_network: true
map:
  - config:rw
options:
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  discovery_prefix: homeassistant
  public_base_url: http://homeassistant.local:8099
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  discovery_prefix: str
  public_base_url: str
ports:
  8099/tcp: 8099
